# name: Analogous
#
# Analogous scheme: neighbouring hues 0, 30, 60 and 90 (red, orange, yellow, yellow-green) on light warm panels.
# Accent, highlight, good, bad, warning and panel colors all come from
# the scheme's hues. Body text keeps at least WCAG AA contrast (4.5:1) on
# the background and both panel colors (checked by TestBuiltinThemeTextContrast).

[palette]
accent = #d98026
background = #fdfbf7
panel = #faf8ef
panel_alt = #f6efda
text = #37291b
text_dim = #705c48
border = #d39e69
highlight = #ffff00
good = #4d7a1f
bad = #b62020
warning = #ef7a06
hp = #6bb620
sp = #cc3333
exp = #e2e212
world_text = #ffffff
shadow = #000000
