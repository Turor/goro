# name: Complementary
#
# Complementary scheme: base hue 205 (blue) and its complement 25 (orange) on dark panels tinted with the base hue.
# Accent, highlight, good, bad, warning and panel colors all come from
# the scheme's hues. Body text keeps at least WCAG AA contrast (4.5:1) on
# the background and both panel colors (checked by TestBuiltinThemeTextContrast).

[palette]
accent = #519fd6
background = #141d24
panel = #1c2830
panel_alt = #27353f
text = #e4ecf1
text_dim = #a0b0ba
border = #44667e
highlight = #fa8f42
good = #5aa9e2
bad = #ef5739
warning = #f4b434
hp = #35d477
sp = #44a1e4
exp = #ea863e
world_text = #ffffff
shadow = #000000

# Dark panels: point the settings derived for the light theme elsewhere.
[theme]
window_title_top = @panel_alt lighten(8%)
window_title = @panel_alt lighten(4%)
title_text = @text
label_text = @accent
context_menu_hover = @accent darken(25%)
skill_required = @bad darken(20%)
hunger_bar = @bad lighten(10%)
