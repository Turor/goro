; Copy to data-server.ini next to the goro executable (or in --data-dir) and
; set the asset server goro streams client data from. data-server.ini is
; gitignored: never commit a real server URL. Only the [data] section is read.
; [data] remote_url in goro.ini or --data-url override it; with no URL at all
; streaming stays off.

[data]
remote_url = https://assets.example.invalid/client/
; remote = auto    ; auto (no local GRFs), on, off
; cache_dir =      ; default: <user cache>/goro/remote/<host>/
; manifest_mode = report
; report (the default) logs a digest or signature mismatch and does not block.
; After a report-mode soak, switch with: manifest_mode = enforce
; enforce fails closed once a signed root has been trusted for this host.
