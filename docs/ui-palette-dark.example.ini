# Example: a dark color theme for goro, set from the palette alone.
#
# This is the built-in Dark theme (Settings > Gameplay > Theme); the same
# settings ship in ui/rotheme/themes/dark.ini. To start your own theme, copy
# this file to themes/<name>.ini next to goro.ini and pick it in the Theme
# list, or copy its lines into ui-layout.ini. Every color setting in
# docs/ui-layout.default.ini defaults to a reference to one of these palette
# colors, so changing the palette re-colors windows, HUD, chat, HP/SP bars,
# damage numbers, names and boards together. With --ui-dev, edits apply while
# the game runs.

[palette]
accent = #c8a24a
background = #1c1f26
panel = #232731
panel_alt = #2c313d
text = #e6e9ef
text_dim = #9aa3b2
border = #4a5263
highlight = #ffd75e
good = #5cc98a
bad = #ff6b6b
warning = #ffa94d
hp = #4ade80
sp = #60a5fa
exp = #c8a24a
world_text = #ffffff
shadow = #000000

# A few settings are derived for the light theme (pale title bars, hovers and
# highlights, dark labels). A dark theme points them elsewhere instead; any
# setting can take its own @reference or an explicit #rrggbb.
[theme]
window_title_top = @panel_alt lighten(8%)
window_title = @panel_alt lighten(4%)
title_text = @text
label_text = @accent
context_menu_hover = @accent darken(25%)
skill_required = @bad darken(20%)
hunger_bar = @bad lighten(10%)
