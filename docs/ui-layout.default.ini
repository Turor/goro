# goro UI layout and theme. Generated by goro --dump-ui-layout.
# Copy the lines you want to change into ui-layout.ini next to goro.ini.
# Omitted keys keep the built-in default. Colors are #rrggbb or #rrggbbaa.
# With --ui-dev (or [ui_layout] watch = true) edits apply while the game runs; F10 reloads.

[button]
# button corner radius (0 to 16)
radius = 6
# button horizontal padding (0 to 32)
padding_x = 8
# button vertical padding (0 to 32)
padding_y = 5.5
# large button vertical padding (0 to 32)
large_padding_y = 8.5
# button glossy highlight opacity (0 to 1)
reflect_alpha = 0.4

[hotbar]
# hotbar slot size (16 to 96)
slot_size = 34
# gap between hotbar slots (0 to 32)
slot_gap = 2
# gap between hotbar rows (0 to 32)
row_gap = 2
# padding around the hotbar grid (0 to 32)
padding = 3

[inventory]
# inventory cell size (16 to 96)
cell_size = 32
# inventory columns (1 to 16)
cols = 8
# visible inventory rows (1 to 20)
rows = 5

[progress_bar]
# progress bar height (2 to 40)
height = 12

[text]
# UI text size in pixels (6 to 32)
size = 11

[theme]
# window background (alpha makes windows translucent)
window_body = #ffffff
# title bar gradient, top
window_title_top = #d6e8fa
# title bar gradient, bottom
window_title = #b8d6f2
# window border and title bar underline
window_border = #76a0ce
# window footer background
window_footer = #f4f6f8
# line above the footer; disabled button border
footer_line = #aeb4bc
# inset panel background
panel_body = #fafcff
# button and hotbar slot fill
button = #ecf4fc
# hovered hotbar slot fill
button_hover = #daebfa
# pressed button fill
button_down = #c6def5
# button and hotbar slot border
button_border = #8aaed6
# disabled button fill
disabled = #e2e6eb
# body text
text = #26303a
# window title text
title_text = #163658
# field labels
label_text = #3a689c
# secondary and disabled text
muted_text = #62707e
# text field border
input_border = #8aaed6
# focused text field border
input_focus = #528ac8
# skill tree prerequisite highlight
skill_required = #ffc0cb
# hovered context menu row
context_menu_hover = #739cef
# player HP bar
hp_bar = #10ef21
# player SP bar
sp_bar = #1863de
# pet and homunculus hunger bar
hunger_bar = #ffe7e7
# hunger bar when low
hunger_bar_low = #ffff00
# positive values and success messages
good_text = #228e48
# errors and negative values
error_text = #cc3030
# alternate panel rows
panel_alt = #ecf4fc

[window]
# window corner radius (0 to 24)
radius = 6
# window border width (0 to 6)
border_width = 1
# space left of the window title (0 to 64)
title_padding_left = 12
# space right of the title bar buttons (0 to 64)
title_padding_right = 7
# gap between title bar buttons (0 to 32)
title_button_gap = 2
# footer left and right padding (0 to 64)
footer_padding = 10
# gap between footer buttons (0 to 64)
footer_gap = 8
