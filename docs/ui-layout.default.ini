# UI font family: the built-in Inter, or the name to give font_file
font_family = Inter
# TTF or OTF file for font_family, relative to this file; empty uses the built-in font
font_file =

[text_area]
# multiline text editor

# line height (8 to 72)
line_height = 18
# preferred width (80 to 1200)
width = 300
# preferred height (36 to 432)
height = 108
# content padding (0 to 24)
padding = 6
# caret inset from the top and bottom of the line (0 to 12)
caret_inset = 2
# selection highlight (= #79a9d76e)
selection = @accent spin(-2) saturate(6.7%) lighten(2.4%) alpha(0.431)

[text_prompt]
# text and password prompt

# prompt width (180 to 800)
width = 306
# prompt content height (32 to 240)
content_height = 70
# text field height (14 to 48)
field_height = 24
# padding around the label and field (0 to 48)
padding = 14
# gap between the label and the field (0 to 32)
gap = 8

[textfield]
# single-line text field

# text inset from the left and right (0 to 24)
pad_x = 6
# text and caret inset from the top and bottom (0 to 16)
pad_y = 4
# inset shadow rows (0 to 16)
shadow_rows = 4
# rows kept clear at the bottom of the inset shadow (0 to 8)
shadow_inset = 2
# inset shadow alpha of the first row (0 to 255)
shadow_alpha = 34
# inset shadow alpha drop per row (0 to 32)
shadow_alpha_step = 7
# inset shadow colour (= #526c8a)
shadow_color = @text_dim spin(2.1) saturate(13%) darken(0.8%)

[theme]
# window background (alpha makes windows translucent) (= #ffffff)
window_body = @background
# title bar gradient, top (= #d6e8fa)
window_title_top = @accent spin(-1.4) saturate(30.9%) lighten(27.5%)
# title bar gradient, bottom (= #b8d6f2)
window_title = @accent spin(-2) saturate(22%) lighten(20%)
# window border and title bar underline (= #76a0ce)
window_border = @accent
# window footer background (= #f4f6f8)
window_footer = @panel spin(-6) desaturate(77.8%) darken(2.5%)
# line above the footer; disabled button border (= #aeb4bc)
footer_line = @border spin(3) desaturate(39%) lighten(2%)
# inset panel background (= #fafcff)
panel_body = @panel
# button and hotbar slot fill (= #ecf4fc)
button = @panel_alt
# hovered hotbar slot fill (= #daebfa)
button_hover = @panel_alt spin(-2) saturate(3%) darken(4%)
# pressed button fill (= #c6def5)
button_down = @panel_alt spin(-0.6) desaturate(2.6%) darken(8.8%)
# button and hotbar slot border (= #8aaed6)
button_border = @border
# disabled button fill (= #e2e6eb)
disabled = @panel_alt spin(3.3) desaturate(54.4%) darken(5.3%)
# body text (= #26303a)
text = @text
# window title text (= #163658)
title_text = @text spin(0.9) saturate(39.2%) lighten(2.7%)
# field labels (= #3a689c)
label_text = @accent spin(0.5) desaturate(1.5%) darken(21.6%)
# secondary and disabled text (= #62707e)
muted_text = @text_dim
# text field border (= #8aaed6)
input_border = @border
# focused text field border (= #528ac8)
input_focus = @accent spin(0.2) saturate(4.4%) darken(8.2%)
# skill tree prerequisite highlight (= #ffc0cb)
skill_required = @bad spin(-10.5) saturate(38.1%) lighten(38.2%)
# hovered context menu row (= #739cef)
context_menu_hover = @accent spin(8.8) saturate(32.2%) lighten(5.9%)
# player HP bar (= #10ef21)
hp_bar = @hp
# player SP bar (= #1863de)
sp_bar = @sp
# pet and homunculus hunger bar (= #ffe7e7)
hunger_bar = @bad saturate(38.1%) lighten(45.9%)
# hunger bar when low (= #ffff00)
hunger_bar_low = @highlight
# positive values and success messages (= #228e48)
good_text = @good
# errors and negative values (= #cc3030)
error_text = @bad
# alternate panel rows (= #ecf4fc)
panel_alt = @panel_alt

[titlebar]
# window title bar

# title bar bottom border thickness (0 to 8)
border_height = 1

[trade]
# player trade window

# window width (320 to 1600)
width = 560
# window height (200 to 1000)
height = 360
# content padding (0 to 40)
padding = 10
# gap between the two panels (0 to 48)
gap = 12
# item panel height before the extra footer (80 to 640)
panel_height = 216
# item row height (12 to 80)
row_height = 28
# zeny field width (40 to 320)
zeny_field_width = 96
# zeny field height (12 to 64)
zeny_field_height = 24
# item rows shown in each panel (1 to 24)
visible_rows = 7
# panel title row height (12 to 64)
title_height = 20
# zeny label width (20 to 160)
zeny_label_width = 42
# zeny row height (12 to 80)
zeny_row_height = 30
# ok status row height (10 to 48)
status_height = 18
# gap between panel rows (0 to 16)
row_gap = 2
# extra panel height below the item list (0 to 160)
panel_extra = 40
# quantity column width (20 to 160)
quantity_width = 42
# extra width around the item icon (0 to 32)
icon_extra = 8

[tuner]
# the --ui-dev F11 UI tuner panel

# tuner width (360 to 1200)
width = 520
# keys shown per page (4 to 40)
rows = 14
# key row height (14 to 40)
row_height = 22
# gap between key rows (0 to 16)
row_gap = 2
# section and search rows height (20 to 120)
header_height = 52
# content padding (0 to 32)
padding = 8
# key name column width (80 to 600)
key_width = 230
# search label width (0 to 200)
search_label_width = 48
# page and status text width (40 to 400)
status_width = 130
# gap from the right screen edge when opened (0 to 400)
screen_right = 16
# distance from the screen top when opened (0 to 400)
screen_top = 60

[vending]
# vending setup and buy windows

# window width (240 to 1400)
width = 420
# visible rows while setting up a shop (1 to 24)
setup_rows = 7
# visible rows in a vendor's shop (1 to 24)
buy_rows = 7
# visible rows in the buying cart (1 to 16)
cart_rows = 4
# shop name row height (16 to 80)
name_height = 30
# gap between the two vending windows (0 to 80)
window_gap = 20
# name label width (24 to 200)
name_label_width = 54
# name and price field height (12 to 64)
field_height = 22
# width kept beside the shop name field (0 to 240)
name_field_inset = 72
# setup content horizontal padding (0 to 32)
padding_x = 8
# setup content vertical padding (0 to 32)
padding_y = 4
# gap inside the setup content (0 to 24)
content_gap = 4
# price field width (40 to 280)
price_width = 90
# gap below the shop name row (0 to 32)
name_gap = 8

[vitals]
# hp and sp rows shared by the character and companion windows

# vitals label width (8 to 80)
label_width = 22
# vitals percent width (16 to 120)
percent_width = 34
# gap between the vitals label, bar and percent (0 to 24)
gap = 6

[warpra]
# Warpra destination list

# window width (240 to 900)
width = 720
# window height (180 to 800)
height = 540
# tab and back button height (12 to 48)
tab_height = 24
# destination row height (12 to 48)
row_height = 22
# destination rows shown (4 to 30)
list_rows = 10
# content padding (0 to 32)
padding = 10
# gap between tabs, crumb, and list (0 to 24)
gap = 6
# gap between tab buttons (0 to 24)
tab_gap = 2
# back button width (32 to 160)
back_width = 64
# gap between the back button and the crumb (0 to 24)
back_gap = 8

[whisper]
# 1:1 chat window

# window width (160 to 900)
width = 286
# message area height (48 to 400)
content_height = 120
# message area horizontal padding (0 to 32)
padding_x = 8
# message area vertical padding (0 to 32)
padding_y = 6
# message field height (16 to 64)
input_height = 24
# window background (= #00000000)
window_background = @shadow alpha(0)
# message panel background (= #0e1218bc)
panel_background = @shadow spin(-144) saturate(26.3%) lighten(7.5%) alpha(0.737)
# message panel border (= #b4c6da5f)
panel_border = @border desaturate(14%) lighten(9%) alpha(0.373)
# incoming message text (= #b5deef)
incoming_text = @accent spin(-13.8) saturate(17.1%) lighten(18.8%)
# outgoing message text (= #ffff78)
outgoing_text = @highlight lighten(23.5%)
# empty conversation text (= #96a5b6)
empty_text = @text_dim spin(1.9) saturate(5.5%) lighten(21.2%)

[window]
# draggable window frame

# window corner radius (0 to 24)
radius = 6
# window border width (0 to 6)
border_width = 1
# space left of the window title (0 to 64)
title_padding_left = 12
# space right of the title bar buttons (0 to 64)
title_padding_right = 7
# gap between title bar buttons (0 to 32)
title_button_gap = 2
# title bar height; windows grow or shrink to keep their content area (16 to 64)
title_height = 28
# footer height; windows grow or shrink to keep their content area (24 to 96)
footer_height = 42
# footer left and right padding (0 to 64)
footer_padding = 10
# gap between footer buttons (0 to 64)
footer_gap = 8
# gap between a window and the screen edge (0 to 64)
screen_margin = 8
# extra pixels invalidated around a moved window (0 to 16)
dirty_padding = 2
# title bar button width (8 to 64)
title_button_size = 17
# bottom-right resize grip (8 to 32)
resize_grip = 12
# smallest resized window width (80 to 640)
min_width = 160
# smallest resized window height (40 to 480)
min_height = 64

[world_map]
# world map atlas

# hovered map highlight (= #ffffff33)
hover_fill = @background alpha(0.2)
# map name label background (= #ffffffd9)
label_fill = @background alpha(0.85)
# preview panel background (= #fffffff2)
preview_fill = @background alpha(0.95)
# hovered map outline width (0 to 8)
hover_stroke = 1
# how far a roll can be from a cell and still highlight it (0 to 24)
hit_slack = 12
# party member map outline width (0 to 8)
member_stroke = 2
# map name text size (6 to 32)
name_size = 9
# map name label height (8 to 40)
name_height = 14
# current map star radius (2 to 32)
star_radius = 7
# current map star stroke width (1 to 8)
star_stroke = 2
# preview panel width (40 to 600)
preview_width = 190
# preview margin from the atlas edge (0 to 64)
preview_edge = 8
# preview inset from the corner (0 to 32)
preview_inset = 4
# preview panel corner radius (0 to 24)
preview_radius = 4
# preview panel border width (0 to 8)
preview_border = 1
# preview text horizontal padding (0 to 32)
preview_pad_x = 6
# preview title offset from the top (0 to 40)
preview_label_y = 3
# preview title height (8 to 48)
preview_label_height = 18
# preview image offset from the top (0 to 80)
preview_image_y = 22
# preview image area height (32 to 400)
preview_image_height = 128
# party name list offset from the top (0 to 400)
preview_member_y = 153
# party name row height (8 to 40)
preview_row_height = 16
# preview panel height before party names (40 to 400)
preview_base_height = 156
# atlas height reserved above the party name rows (0 to 400)
preview_rows_top = 164
# longest side of a preview minimap (32 to 512)
preview_max = 128
# region rail width (80 to 240)
rail_width = 132
# player and party dot size (1 to 16)
dot_size = 4
# warp lock or check mark size (4 to 32)
mark_size = 10
# warp mark inset from the tile corner (0 to 24)
mark_inset = 3
# warp mark arm length (1 to 16)
mark_arm = 4
# check mark notch inset (0 to 12)
mark_notch = 1
# check mark drop (1 to 16)
mark_drop = 4
# check mark tip reach (1 to 16)
mark_tip = 5
# warp mark stroke width (1 to 8)
mark_stroke = 2
