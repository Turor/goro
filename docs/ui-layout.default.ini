# NPC names (= #94bdf7)
npc = @accent spin(4) saturate(39%) lighten(14%)
# monster names (= #ffc6c6)
monster = @bad saturate(38.1%) lighten(39.4%)
# other players and everything else (= #f8f8f8)
other = @world_text darken(2.7%)
# text outline (= #000000c4)
outline = @shadow alpha(0.77)
# name distance below the actor's feet (times the actor scale) (-100 to 200)
label_offset = 13
# HP bar distance below the name (-100 to 200)
life_bar_gap = 14
# cast bar distance below the top of the sprite (-100 to 200)
