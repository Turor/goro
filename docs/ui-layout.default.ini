# goro UI layout and theme. Generated by goro --dump-ui-layout.
# Copy the lines you want to change into ui-layout.ini next to goro.ini.
# Omitted keys keep the built-in default. Colors are #rrggbb or #rrggbbaa, or a
# [palette] reference such as @panel, @accent darken(15%) or @bad alpha(0.8):
# change a palette color and every setting that refers to it follows.
# With --ui-dev (or [ui_layout] watch = true) edits apply while the game runs; F10 reloads.

[palette]
# base colors of the theme: every color setting below defaults to @name of one of these, optionally with lighten/darken/saturate/desaturate(N%), spin(deg) or alpha(0-1)

# accent: window borders, title bars, selection
accent = #76a0ce
# window background
background = #ffffff
# inset panels and light fills
panel = #fafcff
# buttons, alternate rows and secondary fills
panel_alt = #ecf4fc
# body text on windows
text = #26303a
# secondary, muted and disabled text
text_dim = #62707e
# button, field and control borders
border = #8aaed6
# highlights and attention: admin names, critical hits, map labels
highlight = #ffff00
# positive values, success, healing
good = #228e48
# errors, damage taken, danger
bad = #cc3030
# warnings, guild markers, low values
warning = #ff8c1a
# HP bars
hp = #10ef21
# SP bars
sp = #1863de
# experience bars
exp = #76a0ce
# text drawn over the game world: names, damage numbers, dark panels
world_text = #ffffff
# outlines, shadows and dark translucent backdrops
shadow = #000000

[achievement]
# achievement window

# window width (240 to 900)
width = 750
# window height (160 to 700)
height = 468
# row height (12 to 48)
row_height = 22
# content padding (0 to 32)
padding = 10
# row gap (0 to 24)
gap = 4
# category sidebar width (80 to 240)
sidebar_width = 140
# selected achievement detail height (80 to 280)
detail_height = 140

[actor_bars]
# HP, SP, hunger and cast bars drawn over characters and monsters

# bar width (10 to 400)
width = 60
# height of one bar row (1 to 40)
row_height = 3
# distance from one row (HP, SP, hunger) to the next (1 to 40)
row_spacing = 4
# frame thickness around the bars (0 to 8)
frame = 1
# gap between the bars and a name drawn below them (0 to 40)
name_gap = 3
# HP fraction below which the low colors are used (0 to 1)
low_ratio = 0.25
# bar frame and row separator (= #10189c)
frame_color = @accent spin(25.2) saturate(34.1%) darken(29.8%)
# empty part of a bar (= #424242)
track = @shadow lighten(26%)
# monster HP (= #ff00e7)
monster_fill = @hp spin(-179) saturate(13%)
# monster HP when low (= #ffff00)
monster_low_fill = @highlight
# player and ally HP when low (normal fill is [theme] hp_bar) (= #ff0000)
player_low_fill = @bad saturate(38.1%) lighten(0.6%)
# cast bar fill when the server sends no color (= #00ff00)
cast_fill = @good spin(-21.1) saturate(38.6%) lighten(15.5%)

[actor_names]
# names under characters, NPCs and monsters in the world

# GM and admin names (= #ffff00)
admin = @highlight
# your own name (= #ffffff)
